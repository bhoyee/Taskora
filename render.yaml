services:
  - type: web
    name: taskora-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__Provider
        value: Postgres
      - key: Database__EnsureCreatedOnStartup
        value: false
      - key: Database__ApplyMigrationsOnStartup
        value: true
      # DemoData is for LOCAL DEVELOPMENT ONLY - it seeds a fixed-id workspace
      # that, on this specific production database, corresponds to a real
      # in-use account. NEVER set this to true here - use PublicDemo below
      # instead, which is fully separate and safe for production.
      - key: DemoData__SeedOnStartup
        value: false
      # PublicDemo seeds a completely separate demo workspace/personas (all
      # "demo-" prefixed emails, own id namespace) for the public "View demo"
      # landing-page button. Safe to set to true here.
      - key: PublicDemo__SeedOnStartup
        value: false
      - key: PublicDemo__ResetScheduler__Enabled
        value: true
      - key: PublicDemo__ResetScheduler__IntervalHours
        value: 24
      - key: ConnectionStrings__TodoApp
        sync: false
      - key: App__PublicBaseUrl
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Authentication__Mode
        value: AppToken
      - key: Authentication__Audience
        value: taskora-api
      # Your real super admin email(s). The public demo's Super Admin persona
      # (demo-superadmin@example.com) is always recognized automatically -
      # it's hardcoded in SuperAdminAuthorization.cs, not configured here -
      # and its actual admin powers are separately restricted so it can only
      # ever act on the demo's own workspace, never a real one.
      - key: Administration__SuperAdminEmails__0
        sync: false
      - key: Email__Smtp__Enabled
        value: true
      - key: Email__Smtp__Host
        sync: false
      - key: Email__Smtp__Port
        value: 587
      - key: Email__Smtp__UseSsl
        value: true
      - key: Email__Smtp__Username
        sync: false
      - key: Email__Smtp__Password
        sync: false
      - key: Email__Smtp__FromAddress
        sync: false
      - key: Email__Smtp__FromName
        value: Taskora
